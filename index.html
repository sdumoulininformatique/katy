<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anniversaire de Katy - Le Poissonnier</title>
    <style>
        :root {
            --fdj-blue: #003399;
            --fdj-yellow: #ffcc00;
            --fdj-red: #e60000;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Arial Black', sans-serif;
            background: radial-gradient(circle, #0044cc 0%, #001a4d 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; 
            height: -webkit-fill-available;
            color: #fff; 
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Conteneur principal pour limiter la hauteur sur mobile */
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            height: 100%;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .main-title {
            font-size: clamp(1rem, 4vh, 1.8rem); /* S'adapte à la hauteur de l'écran */
            color: var(--fdj-yellow);
            text-shadow: 2px 2px 0px var(--fdj-blue), 0 0 8px rgba(0,0,0,0.5);
            margin: 0;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.2;
        }

        .sub-title {
            font-size: clamp(0.7rem, 2.5vh, 1.1rem);
            opacity: 0.9;
            text-align: center;
            margin: 5px 0;
        }

        .ticket {
            position: relative; 
            /* Le ticket prend 60% de la hauteur de l'écran maximum */
            height: 60vh;
            aspect-ratio: 420 / 600; 
            background-image: url('image_78a3ec.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border: 3px solid #fff; 
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            user-select: none;
            touch-action: none;
        }

        .scratch-container {
            position: absolute; 
            width: 78.5%; 
            height: 46.6%; 
            top: 67.5%; 
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 8px;
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            border: 1px solid rgba(255,255,255,0.3);
        }

        #scratch-layer {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: 10;
            touch-action: none;
        }

        #bravo-msg {
            display: none; z-index: 5;
            color: var(--fdj-blue); 
            font-size: clamp(1.2rem, 5vw, 2rem);
            animation: pulse 0.8s infinite;
            background: rgba(255,255,255,0.98);
            padding: 10px; border-radius: 10px;
            text-align: center;
            width: 80%;
        }

        #gift-btn {
            display: none; z-index: 20;
            background: var(--fdj-red); color: white;
            border: 2px solid white; 
            padding: 12px 20px;
            border-radius: 40px; 
            font-size: clamp(0.9rem, 4vw, 1.2rem); 
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            animation: bounce 2s infinite;
        }

        #final-reveal {
            display: none; position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.98); z-index: 100; 
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
            box-sizing: border-box;
        }

        .main-prize { color: var(--fdj-yellow); font-size: clamp(1.5rem, 8vw, 2.5rem); margin-bottom: 15px; }
        .indices { color: white; font-size: clamp(0.85rem, 4vw, 1.3rem); line-height: 1.5; }

        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
        .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 200; }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1 class="main-title">✨ Bon Anniversaire Katy ✨</h1>
        <p class="sub-title">Trouve les 5 Poissons pour gagner ton cadeau !</p>

        <div class="ticket">
            <div class="scratch-container">
                <h2 id="bravo-msg">BRAVO !</h2>
                <button id="gift-btn" onclick="explodeGift()">🎁 VOIR MON GAIN</button>
                <canvas id="scratch-layer"></canvas>
            </div>
        </div>
    </div>

    <div id="final-reveal">
        <div class="main-prize">✨ WEEK-END À 2 ✨</div>
        <div class="indices">
            <p><i>Indice 1 :</i> Les dorures de Jean Lamour...</p>
            <p><i>Indice 2 :</i> Le goût d'une bille d'or ambrée...</p>
            <p><i>Indice 3 :</i> On y croise l'Ecole d'Art Nouveau.</p>
            <p style="font-size: clamp(1.2rem, 6vw, 2rem); margin-top: 25px; color: var(--fdj-yellow);">
                <strong>JOYEUX ANNIVERSAIRE MAMAN !</strong>
            </p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scratch-layer');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.querySelector('.scratch-container');
        let drawing = false;

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            setup();
        }

        function setup() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for(let i=0; i < 500; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#FFD700' : '#E0E0E0';
                ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
            }

            ctx.fillStyle = '#003399';
            ctx.textAlign = 'center';
            ctx.font = `bold ${canvas.width/10}px Arial`;
            ctx.fillText('ZONE DE GAIN', canvas.width/2, canvas.height/2);
            ctx.font = `${canvas.width/15}px Arial`;
            ctx.fillText('GRATTEZ ICI', canvas.width/2, canvas.height/2 + (canvas.width/10));
        }

        function scratch(e) {
            if(!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath(); 
            ctx.arc(x, y, canvas.width / 6, 0, Math.PI*2); 
            ctx.fill();
            check();
        }

        function check() {
            const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
            let count = 0;
            for(let i=3; i<data.length; i+=4) if(data[i]===0) count++;
            if(count > (data.length/4)*0.75) {
                canvas.style.transition = 'opacity 0.8s ease-in-out';
                canvas.style.opacity = '0';
                setTimeout(() => {
                    canvas.style.display = 'none';
                    document.getElementById('bravo-msg').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('bravo-msg').style.display = 'none';
                        document.getElementById('gift-btn').style.display = 'block';
                    }, 3000); 
                }, 800);
            }
        }

        function explodeGift() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            for(let i=0; i<100; i++) createParticle(centerX, centerY);
            setTimeout(() => { document.getElementById('final-reveal').style.display = 'flex'; }, 600);
        }

        function createParticle(x, y) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.style.backgroundColor = ['#FFD700', '#FF0000', '#FFF', '#00FF00'][Math.floor(Math.random()*4)];
            document.body.appendChild(p);
            const angle = Math.random() * Math.PI * 2;
            const velocity = 3 + Math.random() * 6;
            p.animate([
                { transform: 'translate(0, 0) scale(1.5)', opacity: 1 },
                { transform: `translate(${Math.cos(angle)*velocity*40}px, ${Math.sin(angle)*velocity*40}px) scale(0)`, opacity: 0 }
            ], { duration: 1000, easing: 'ease-out' });
            setTimeout(() => p.remove(), 1000);
        }

        window.addEventListener('resize', resizeCanvas);
        canvas.addEventListener('mousedown', () => drawing=true);
        window.addEventListener('mouseup', () => drawing=false);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchstart', (e) => { drawing=true; if(e.cancelable) e.preventDefault(); scratch(e); }, {passive: false});
        canvas.addEventListener('touchend', () => drawing=false);
        canvas.addEventListener('touchmove', (e) => { if(e.cancelable) e.preventDefault(); scratch(e); }, {passive: false});

        setTimeout(resizeCanvas, 100);
    </script>
</body>
</html>
