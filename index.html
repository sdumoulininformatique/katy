<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anniversaire de Katy - Le Poissonnier</title>
    <style>
        :root {
            --fdj-blue: #003399;
            --fdj-yellow: #ffcc00;
            --fdj-red: #e60000;
            --gold: #d4af37;
            /* Variables de base pour le ratio responsive */
            --base-width: 420;
            --base-height: 600;
            --ticket-width: 90vw;
            --max-ticket-width: 420px;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Arial Black', sans-serif;
            background: radial-gradient(circle, #0044cc 0%, #001a4d 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh; color: #fff; 
            overflow-x: hidden;
            padding: 10px;
            box-sizing: border-box;
        }

        .main-title {
            font-size: clamp(1.2rem, 5vw, 2.2rem);
            color: var(--fdj-yellow);
            text-shadow: 2px 2px 0px var(--fdj-blue), 0 0 10px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        .ticket {
            position: relative; 
            width: var(--ticket-width);
            max-width: var(--max-ticket-width);
            /* Maintient le ratio 420/600 */
            aspect-ratio: 420 / 600; 
            background-image: url('image_78a3ec.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border: clamp(3px, 1vw, 6px) solid #fff; 
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            user-select: none;
            touch-action: none;
        }

        /* --- ZONE À GRATTER RESPONSIVE --- */
        .scratch-container {
            position: absolute; 
            width: 78.5%; /* (330/420) */
            height: 46.6%; /* (280/600) */
            top: 67.5%; 
            left: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
            border-radius: 8px;
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            border: 1px solid rgba(255,255,255,0.3);
        }

        #scratch-layer {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%;
            height: 100%;
            z-index: 10;
            touch-action: none; 
            cursor: crosshair;
        }

        #bravo-msg {
            display: none; z-index: 5;
            color: var(--fdj-blue); 
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            animation: pulse 0.8s infinite;
            background: rgba(255,255,255,0.96);
            padding: 15px; border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            width: 80%;
        }

        #gift-btn {
            display: none; z-index: 20;
            background: var(--fdj-red); color: white;
            border: 3px solid white; 
            padding: 12px 20px;
            border-radius: 50px; 
            font-size: clamp(0.9rem, 4vw, 1.3rem); 
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            animation: bounce 2s infinite;
            white-space: nowrap;
        }

        #final-reveal {
            display: none; position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.97); z-index: 100; 
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
            box-sizing: border-box;
        }

        .main-prize { 
            color: var(--fdj-yellow); 
            font-size: clamp(1.8rem, 8vw, 3rem); 
            margin-bottom: 20px; 
            text-shadow: 0 0 20px orange;
        }
        
        .indices { 
            color: white; 
            font-size: clamp(1rem, 4vw, 1.5rem); 
            line-height: 1.6; 
            max-width: 500px;
        }

        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-15px);} 60% {transform: translateY(-8px);} }
        .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 200; }

        @media (max-width: 480px) {
            .ticket { border-width: 4px; }
            .main-title { margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <h1 class="main-title">✨ Bon Anniversaire Katy ! ✨</h1>
    <h2 class="main-title" style="font-size: clamp(0.9rem, 4vw, 1.3rem); opacity: 0.9;">
        Trouve 5 Poissons différents pour gagner !
    </h2>

    <div class="ticket">
        <div class="scratch-container">
            <h2 id="bravo-msg">BRAVO !</h2>
            <button id="gift-btn" onclick="explodeGift()">🎁 VOIR MON GAIN !</button>
            <canvas id="scratch-layer"></canvas>
        </div>
    </div>

    <div id="final-reveal">
        <div class="main-prize">✨ WEEK-END À 2 ✨</div>
        <div class="indices">
            <p><i>Indice 1 :</i> Les dorures de Jean Lamour...</p>
            <p><i>Indice 2 :</i> Le goût d'une petite bille d'or ambrée...</p>
            <p><i>Indice 3 :</i> On y croise l'Ecole d'Art Nouveau.</p>
            <p style="font-size: clamp(1.5rem, 6vw, 2.5rem); margin-top: 30px; color: var(--fdj-yellow);">
                <strong>JOYEUX ANNIVERSAIRE MAMAN !</strong>
            </p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scratch-layer');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.querySelector('.scratch-container');
        let drawing = false;

        // Fonction pour adapter le canvas à sa taille réelle à l'écran
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            setup(); // Redessine la couche blanche
        }

        function setup() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Texture grattage adaptée
            const particleCount = (canvas.width * canvas.height) / 120;
            for(let i=0; i < particleCount; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#FFD700' : '#E0E0E0';
                ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
            }

            // Texte centré dynamique
            ctx.fillStyle = '#003399';
            const fontSizeBig = Math.max(16, canvas.width / 12);
            const fontSizeSmall = Math.max(12, canvas.width / 18);
            
            ctx.font = `bold ${fontSizeBig}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('ZONE DE GAIN', canvas.width/2, canvas.height/2);
            
            ctx.font = `${fontSizeSmall}px Arial`;
            ctx.fillText('GRATTEZ ICI', canvas.width/2, (canvas.height/2) + fontSizeBig);
        }

        function scratch(e) {
            if(!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath(); 
            // Taille du pinceau proportionnelle
            const brushSize = canvas.width / 8;
            ctx.arc(x, y, brushSize, 0, Math.PI*2); 
            ctx.fill();
            check();
        }

        function check() {
            const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
            let count = 0;
            for(let i=3; i<data.length; i+=4) if(data[i]===0) count++;
            
            if(count > (data.length/4)*0.75) {
                canvas.style.transition = 'opacity 0.8s ease-in-out';
                canvas.style.opacity = '0';
                setTimeout(() => {
                    canvas.style.display = 'none';
                    document.getElementById('bravo-msg').style.display = 'block';
                    
                    setTimeout(() => {
                        document.getElementById('bravo-msg').style.display = 'none';
                        document.getElementById('gift-btn').style.display = 'block';
                    }, 3000); 
                }, 800);
            }
        }

        function explodeGift() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            for(let i=0; i<150; i++) createParticle(centerX, centerY);
            setTimeout(() => { document.getElementById('final-reveal').style.display = 'flex'; }, 600);
        }

        function createParticle(x, y) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.style.backgroundColor = ['#FFD700', '#FF0000', '#0033FF', '#FFF', '#00FF00'][Math.floor(Math.random()*5)];
            document.body.appendChild(p);
            const angle = Math.random() * Math.PI * 2;
            const velocity = 5 + Math.random() * 10;
            p.animate([
                { transform: 'translate(0, 0) scale(1.5)', opacity: 1 },
                { transform: `translate(${Math.cos(angle)*velocity*50}px, ${Math.sin(angle)*velocity*50}px) scale(0)`, opacity: 0 }
            ], { duration: 1500, easing: 'ease-out' });
            setTimeout(() => p.remove(), 1500);
        }

        // Events
        window.addEventListener('resize', resizeCanvas);
        canvas.addEventListener('mousedown', () => drawing=true);
        window.addEventListener('mouseup', () => drawing=false);
        canvas.addEventListener('mousemove', scratch);
        
        canvas.addEventListener('touchstart', (e) => { 
            drawing=true; 
            if(e.cancelable) e.preventDefault(); 
            scratch(e); 
        }, {passive: false});
        
        canvas.addEventListener('touchend', () => drawing=false);
        canvas.addEventListener('touchmove', (e) => { 
            if(e.cancelable) e.preventDefault(); 
            scratch(e); 
        }, {passive: false});

        // Init
        resizeCanvas();
    </script>
</body>
</html>
