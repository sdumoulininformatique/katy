<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anniversaire de Katy - Le Poissonnier</title>
    <style>
        :root {
            --fdj-blue: #003399;
            --fdj-yellow: #ffcc00;
            --fdj-red: #e60000;
            --gold: #d4af37;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Arial Black', sans-serif;
            background: radial-gradient(circle, #0044cc 0%, #001a4d 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh; color: #fff; overflow: hidden;
        }

        .main-title {
            font-size: 2.2rem;
            color: var(--fdj-yellow);
            text-shadow: 4px 4px 0px var(--fdj-blue), 0 0 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
        }

        .ticket {
            position: relative; 
            width: 420px; 
            height: 600px; 
            background-image: url('image_78a3ec.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border: 6px solid #fff; 
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.8);
            user-select: none;
        }

        /* --- ZONE À GRATTER : LARGE ET HAUTE --- */
        .scratch-container {
            position: absolute; 
            width: 330px; 
            height: 280px; 
            top: 67.5%; 
            left: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
            border-radius: 12px;
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            border: 2px solid rgba(255,255,255,0.3);
        }

        #scratch-layer {
            position: absolute; 
            top: 0; left: 0; 
            z-index: 10;
            touch-action: none; 
            cursor: crosshair;
        }

        #bravo-msg {
            display: none; z-index: 5;
            color: var(--fdj-blue); font-size: 2.5rem;
            animation: pulse 0.8s infinite;
            background: rgba(255,255,255,0.96);
            padding: 20px; border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
        }

        #gift-btn {
            display: none; z-index: 20;
            background: var(--fdj-red); color: white;
            border: 3px solid white; padding: 18px 35px;
            border-radius: 60px; font-size: 1.3rem; cursor: pointer;
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
            animation: bounce 2s infinite;
            white-space: nowrap;
        }

        #final-reveal {
            display: none; position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.97); z-index: 100; 
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }

        .main-prize { color: var(--fdj-yellow); font-size: 3rem; margin-bottom: 30px; text-shadow: 0 0 20px orange;}
        .indices { color: white; font-size: 1.5rem; line-height: 2; }

        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-20px);} 60% {transform: translateY(-10px);} }
        .particle { position: absolute; width: 12px; height: 12px; border-radius: 50%; pointer-events: none; z-index: 200; }
    </style>
</head>
<body>

    <h1 class="main-title">✨ Bon Anniversaire Katy ! ✨</h1>
    <h2 class="main-title">✨  C'est gagné si tu trouves 5 Poissons de couleur differente ! ✨</h2>
    <div class="ticket">
        <div class="scratch-container">
            <h2 id="bravo-msg">BRAVO !</h2>
            <button id="gift-btn" onclick="explodeGift()">🎁 VOIR MON GAIN !</button>
            <canvas id="scratch-layer" width="330" height="280"></canvas>
        </div>
    </div>

    <div id="final-reveal">
        <div class="main-prize">✨ WEEK-END À 2 ✨</div>
        <div class="indices">
            <p><i>Indice 1 :</i> Les dorures de Jean Lamour...</p>
            <p><i>Indice 2 :</i> Le goût d'une petite bille d'or ambrée...</p>
            <p><i>Indice 3 :</i> On y croise l'Ecole d'Art Nouveau.</p>
            <p style="font-size: 2.5rem; margin-top: 50px; color: var(--fdj-yellow);">
                <strong>JOYEUX ANNIVERSAIRE MAMAN !</strong>
            </p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scratch-layer');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let drawing = false;

        function setup() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, 330, 280);
            
            for(let i=0; i<750; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#FFD700' : '#E0E0E0';
                ctx.fillRect(Math.random()*330, Math.random()*280, 2, 2);
            }

            ctx.fillStyle = '#003399';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('ZONE DE GAIN', 165, 130);
            
            ctx.font = '18px Arial';
            ctx.fillText('GRATTEZ ICI', 165, 160);
        }

        function scratch(e) {
            if(!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI*2); ctx.fill();
            check();
        }

        function check() {
            const data = ctx.getImageData(0,0,330,280).data;
            let count = 0;
            for(let i=3; i<data.length; i+=4) if(data[i]===0) count++;
            
            if(count > (data.length/4)*0.75) {
                canvas.style.transition = 'opacity 0.8s ease-in-out';
                canvas.style.opacity = '0';
                setTimeout(() => {
                    canvas.style.display = 'none';
                    document.getElementById('bravo-msg').style.display = 'block';
                    
                    // CHANGEMENT : Délai réduit à 3 secondes (3000ms)
                    setTimeout(() => {
                        document.getElementById('bravo-msg').style.display = 'none';
                        document.getElementById('gift-btn').style.display = 'block';
                    }, 3000); 
                }, 800);
            }
        }

        function explodeGift() {
            for(let i=0; i<200; i++) createParticle(window.innerWidth/2, window.innerHeight/2);
            setTimeout(() => { document.getElementById('final-reveal').style.display = 'flex'; }, 600);
        }

        function createParticle(x, y) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.style.backgroundColor = ['#FFD700', '#FF0000', '#0033FF', '#FFF', '#00FF00'][Math.floor(Math.random()*5)];
            document.body.appendChild(p);
            const angle = Math.random() * Math.PI * 2;
            const velocity = 8 + Math.random() * 15;
            p.animate([
                { transform: 'translate(0, 0) scale(1.5)', opacity: 1 },
                { transform: `translate(${Math.cos(angle)*velocity*60}px, ${Math.sin(angle)*velocity*60}px) scale(0)`, opacity: 0 }
            ], { duration: 1800, easing: 'ease-out' });
            setTimeout(() => p.remove(), 1800);
        }

        canvas.addEventListener('mousedown', () => drawing=true);
        window.addEventListener('mouseup', () => drawing=false);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('touchstart', (e) => { drawing=true; e.preventDefault(); scratch(e); });
        canvas.addEventListener('touchend', () => drawing=false);
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); scratch(e); });
        setup();
    </script>
</body>
</html>
